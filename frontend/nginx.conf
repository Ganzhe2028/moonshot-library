# HTTP 到 HTTPS 重定向配置
server {
    listen 80;
    listen [::]:80;
    server_name localhost;
    
    # 将所有HTTP请求重定向到HTTPS
    return 301 https://$host$request_uri;
}

# HTTPS 服务器配置
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name localhost;

    # SSL证书配置
    ssl_certificate /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;
    
    # SSL优化配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256';
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    
    # 增加超时设置，优化代理性能
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    client_body_timeout 600s;
    client_header_timeout 600s;
    send_timeout 600s;
    resolver_timeout 600s;

    # 前端静态文件
    root /usr/share/nginx/html;
    index index.html;

    # 支持Vue Router的history模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API代理到后端服务 - 修复HTTPS/HTTP混合内容问题
    location /api {
        # 指向Docker网络中的后端服务（容器间通信使用HTTP）
        proxy_pass http://backend:3000;
        
        # 关键修复：确保正确传递协议信息，让后端知道原始请求是HTTPS
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 确保这里设置为https
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Ssl on;
        
        # 启用HTTP/1.1，支持长连接
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        
        # 增加缓冲区设置，提高性能
        proxy_buffers 16 64k;
        proxy_buffer_size 128k;
        proxy_busy_buffers_size 256k;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}